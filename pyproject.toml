[project]
name = "lumiere-ai-service"
version = "2.0.0"
description = "FastAPI AI service for Lumiere Restaurant — rebuilt per New_AI.md spec."
requires-python = ">=3.12"
dependencies = [
  # Web framework
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  # Vector DB (Module 1)
  "qdrant-client>=1.11",
  # Hybrid search BM25 (Module 2)
  "rank-bm25>=0.2",
  # Association rule mining FP-Growth (Module 3)
  "mlxtend>=0.23",
  # Trend forecasting (Module 3)
  "lightgbm>=4.5",
  "pandas>=2.2,<3.0.0",
  "numpy>=1.26,<2.0.0",
  "scikit-learn>=1.5",
  # Kitchen batching scheduling (Module 3)
  "ortools>=9.10",
  # Redis async client (feedback CTR store + job status)
  "redis[asyncio]>=5.0",
  # Model persistence
  "joblib>=1.4",
  "protobuf>=3.20.2,<6.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
